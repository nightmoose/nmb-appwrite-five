[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmb-five"
version = "0.1.0"
description = "Five Appwrite databases, one storefront, DataContractGate at every edge."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "contractgate @ git+https://github.com/nightmoose/contractgate.git#subdirectory=sdks/python",
]

[project.optional-dependencies]
appwrite = ["appwrite>=26.0.0", "psycopg[binary]>=3.1", "PyMySQL>=1.1"]
dev = ["pytest>=8"]

[project.scripts]
nmb-five = "nmb_five.cli:main"

[tool.setuptools.packages.find]
include = ["nmb_five*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
