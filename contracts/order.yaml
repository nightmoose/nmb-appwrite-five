version: "1.0"
name: "order"
description: "Order row (Managed PostgreSQL)"
ontology:
  entities:
    - {name: order_id, type: string, required: true, pattern: "^o_[a-z0-9_]{3,40}$"}
    - {name: user_id, type: string, required: true, pattern: "^u_[a-z0-9]{3,32}$"}
    - {name: sku, type: string, required: true, pattern: "^SKU-[0-9]{4}$"}
    - {name: quantity, type: integer, required: true, min: 1, max: 99}
    - {name: total_cents, type: integer, required: true, min: 1}
    - {name: status, type: string, required: true, enum: ["placed", "paid", "refunded"]}
